# Le relais des idées sans compte GitHub, sur Cloudflare Workers. Mise en place : docs/relais.md.
# Lu par `labo relais deployer` (pas par wrangler : ni Node ni Python dans le projet).
# Le code est compilé par Fable dans js/ :  dotnet fable src/Labo.Relais -o src/Labo.Relais/js
name = "labo-relais"
main = "js/Worker.js"
compatibility_date = "2026-11-01"

[vars]
DEPOT_PUBLIC = "labo-de-la-bande/labo-de-la-bande.github.io"
# les pages autorisées à écrire au relais, et les hôtes où le widget anti-spam doit avoir été résolu ;
ORIGINES = "https://labo-de-la-bande.github.io"
HOTES = "labo-de-la-bande.github.io"
PAGE_SUIVI = "https://labo-de-la-bande.github.io/jeu/proposer.html"
MAIL_EXPEDITEUR = ""
LIMITE_PAR_HEURE = "5"
# l'atelier des données (docs/atelier.md) : le dépôt où le relais écrit, et l'application GitHub
# (son identifiant et celui de son installation ; sa clé privée est le secret ATELIER_CLE)
DEPOT_ATELIER = "labo-de-la-bande/atelier"
ATELIER_APP_ID = ""
ATELIER_INSTALLATION = ""

# Les secrets ne sont jamais ici : `labo relais secret <NOM>` (docs/relais.md)
#   TURNSTILE_SECRET (obligatoire), BREVO_CLE (facultatif, pour prévenir les joueurs par mail),
#   ATELIER_CLE (la clé privée de l'application GitHub de l'atelier : `labo atelier cle`)

[[kv_namespaces]]
binding = "IDEES"
# l'identifiant de l'espace KV IDEES (créé une fois)
id = "dd9ae9980bdf4dfbba1dec8a3f91372f"
