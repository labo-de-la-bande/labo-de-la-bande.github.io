<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src https://labo-relais.labo-de-la-bande.workers.dev; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>L'atelier des données</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* La page de l'atelier des données : mêmes couleurs et polices que le jeu (jeu/index.html). */
:root{
  --fond:#f1f3f9; --carte:#ffffff; --encre:#191c38; --encre-douce:#5b6084; --trait:#d9ddec; --puce:#e6e9f5;
  --accent:#3646e8; --accent-encre:#ffffff; --bon:#13795b; --moyen:#a35f00; --faible:#c02c35;
  --ciel-haut:#bcd3f7; --ciel-bas:#eef3fb; --soleil:#f5b83d; --terre:#b9a37e; --mer:#3d7fc4; --foret:#2f7a4a;
  --champ:#8fbf4f; --champ-2:#c9b24a; --maison:#7c6f8e; --fenetre:#ffd964; --cellule:#3646e8; --bateau:#ffffff;
  --f-titre:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-texte:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-chiffre:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fond:#0d0f20; --carte:#171a33; --encre:#e6e8f5; --encre-douce:#a3a8cc; --trait:#2c3159; --puce:#232750;
  --accent:#8e9aff; --accent-encre:#0d0f20; --bon:#3fd0a0; --moyen:#f2a83c; --faible:#ff6f74;
  --ciel-haut:#141a3d; --ciel-bas:#2a3166; --soleil:#f2d67a; --terre:#4a4157; --mer:#1d3f6e; --foret:#2c6b45;
  --champ:#5f8a35; --champ-2:#8a7a35; --maison:#5d5370; --fenetre:#ffd964; --cellule:#8e9aff; --bateau:#cfd6ff;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --fond:#0d0f20; --carte:#171a33; --encre:#e6e8f5; --encre-douce:#a3a8cc; --trait:#2c3159; --puce:#232750;
  --accent:#8e9aff; --accent-encre:#0d0f20; --bon:#3fd0a0; --moyen:#f2a83c; --faible:#ff6f74;
  --ciel-haut:#141a3d; --ciel-bas:#2a3166; --soleil:#f2d67a; --terre:#4a4157; --mer:#1d3f6e; --foret:#2c6b45;
  --champ:#5f8a35; --champ-2:#8a7a35; --maison:#5d5370; --fenetre:#ffd964; --cellule:#8e9aff; --bateau:#cfd6ff;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fond); color:var(--encre); font-family:var(--f-texte); font-size:15px; line-height:1.5;
  padding:env(safe-area-inset-top,0) max(16px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(16px, env(safe-area-inset-left,0px))}
h1,h2{font-family:var(--f-titre); margin:0; line-height:1.15; text-wrap:balance}
h1{font-size:clamp(28px,5vw,40px); font-weight:800}
h2{font-size:19px; font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit; cursor:pointer; color:inherit}
.page{max-width:680px; margin:0 auto; padding:28px 0 60px; display:grid; gap:16px}
.tete{display:grid; gap:10px}
.accroche{font-size:17px; color:var(--encre-douce)}
.carte{background:var(--carte); border:1px solid var(--trait); border-radius:14px; padding:18px; display:grid; gap:14px}
.champ{display:grid; gap:5px; border:0; padding:0; margin:0}
.champ label, .champ legend, .champ summary{font-weight:700}
.champ summary{cursor:pointer; color:var(--accent)}
.choix{font-weight:400 !important; display:flex; gap:6px; align-items:baseline}
.aide, .discret{color:var(--encre-douce); font-size:13.5px}
input[type=text], input[type=email], textarea, select{font:inherit; color:var(--encre); background:var(--fond); border:1.5px solid var(--trait);
  border-radius:10px; padding:9px 11px; width:100%}
input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
textarea{resize:vertical}
.piege{position:absolute; left:-10000px; width:1px; height:1px; overflow:hidden}
.actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
.principal{background:var(--accent); color:var(--accent-encre); border:0; border-radius:10px; padding:10px 18px; font-weight:700}
.principal[disabled]{opacity:.5; cursor:wait}
.secondaire{background:transparent; color:var(--encre); border:1.5px solid var(--trait); border-radius:10px; padding:10px 16px; font-weight:700}
.lien-discret{background:none; border:0; color:var(--accent); font-weight:700; padding:2px 0; font-size:13.5px; text-decoration:none}
.message{border-radius:12px; padding:14px 16px; display:grid; gap:6px; background:var(--carte); border:1px solid var(--trait)}
.message.bon{border-color:var(--bon)}
.message.erreur{border-color:var(--faible); color:var(--faible); font-weight:700}
.suivis{list-style:none; margin:0; padding:0; display:grid; gap:12px}
.suivis li{display:grid; gap:4px; padding-bottom:12px; border-bottom:1px solid var(--trait)}
.suivi-tete{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
.puce{display:inline-block; padding:2px 9px; border-radius:999px; background:var(--puce); font-size:12.5px; font-weight:700}
.puce.discrete{background:transparent; border:1px solid var(--trait); font-weight:400; color:var(--encre-douce)}
.atelier{display:grid; gap:16px}
.atelier .suivi-tete{justify-content:space-between}
/* le sommaire : les tables, en onglets qui passent à la ligne */
.sommaire{gap:12px}
.famille{display:grid; gap:6px}
.onglets{display:flex; flex-wrap:wrap; gap:6px}
.onglet{display:inline-flex; gap:7px; align-items:baseline; background:var(--fond); border:1.5px solid var(--trait); border-radius:999px; padding:6px 12px; font-weight:700; font-size:14px}
.onglet.actif{background:var(--accent); color:var(--accent-encre); border-color:var(--accent)}
.nombre{font-family:var(--f-chiffre); font-size:12px; opacity:.75}
/* la recherche, puis les lignes par groupe */
.recherche{display:grid; gap:4px}
input[type=search]{font:inherit; color:var(--encre); background:var(--fond); border:1.5px solid var(--trait); border-radius:10px; padding:9px 11px; width:100%}
.groupes{display:grid; gap:8px}
.groupe{border:1px solid var(--trait); border-radius:10px; padding:0 12px}
.groupe > summary{cursor:pointer; padding:10px 0; font-weight:700; display:flex; gap:8px; align-items:baseline}
.groupe[open] > summary{border-bottom:1px solid var(--trait); margin-bottom:10px}
.groupe > ul{padding-bottom:4px}
.suivis li:last-child{border-bottom:0}
.edition{background:var(--fond); border-radius:10px; padding:12px; gap:10px}
[hidden]{display:none !important}
</style>
</head>
<body>
<div id="atelier"><p class="discret" style="padding:40px 0">Chargement…</p></div>
<script type="module" src="./js/AtelierPage.js"></script>
</body>
</html>
