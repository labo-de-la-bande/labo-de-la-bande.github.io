<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Labo de la Bande</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Mise en page : en-tête de la révolution ; à gauche la scène (territoire, puis la situation), à droite les jauges. Couleurs et polices du jeu. */
:root{
  --fond:#f1f3f9; --carte:#ffffff; --encre:#191c38; --encre-douce:#5b6084; --trait:#d9ddec; --puce:#e6e9f5;
  --accent:#3646e8; --accent-encre:#ffffff; --bon:#13795b; --moyen:#a35f00; --faible:#c02c35;
  --ciel-haut:#bcd3f7; --ciel-bas:#eef3fb; --soleil:#f5b83d; --terre:#b9a37e; --mer:#3d7fc4; --foret:#2f7a4a;
  --champ:#8fbf4f; --champ-2:#c9b24a; --maison:#7c6f8e; --fenetre:#ffd964; --cellule:#3646e8; --bateau:#ffffff;
  --f-titre:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-texte:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-chiffre:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fond:#0d0f20; --carte:#171a33; --encre:#e6e8f5; --encre-douce:#a3a8cc; --trait:#2c3159; --puce:#232750;
  --accent:#8e9aff; --accent-encre:#0d0f20; --bon:#3fd0a0; --moyen:#f2a83c; --faible:#ff6f74;
  --ciel-haut:#141a3d; --ciel-bas:#2a3166; --soleil:#f2d67a; --terre:#4a4157; --mer:#1d3f6e; --foret:#2c6b45;
  --champ:#5f8a35; --champ-2:#8a7a35; --maison:#5d5370; --fenetre:#ffd964; --cellule:#8e9aff; --bateau:#cfd6ff;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --fond:#0d0f20; --carte:#171a33; --encre:#e6e8f5; --encre-douce:#a3a8cc; --trait:#2c3159; --puce:#232750;
  --accent:#8e9aff; --accent-encre:#0d0f20; --bon:#3fd0a0; --moyen:#f2a83c; --faible:#ff6f74;
  --ciel-haut:#141a3d; --ciel-bas:#2a3166; --soleil:#f2d67a; --terre:#4a4157; --mer:#1d3f6e; --foret:#2c6b45;
  --champ:#5f8a35; --champ-2:#8a7a35; --maison:#5d5370; --fenetre:#ffd964; --cellule:#8e9aff; --bateau:#cfd6ff;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fond); color:var(--encre); font-family:var(--f-texte); font-size:15px; line-height:1.5;
  padding:env(safe-area-inset-top,0) max(16px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(16px, env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--f-titre); margin:0; line-height:1.15; text-wrap:balance}
h1{font-size:clamp(30px,5vw,46px); font-weight:800}
h2{font-size:21px; font-weight:700}
h3{font-size:16px}
p{margin:0}
button{font:inherit; cursor:pointer; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.petit-titre{font-family:var(--f-texte); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--encre-douce); font-weight:700}
.discret{color:var(--encre-douce); font-size:13.5px}
.ref{color:var(--accent); cursor:help; margin-left:1px}
.ref.manque{color:var(--faible)}
.puce{display:inline-block; padding:2px 9px; border-radius:999px; background:var(--puce); font-size:12.5px; font-weight:700}
.puce.bon{color:var(--bon)} .puce.faible{color:var(--faible)}
.ecart{font-family:var(--f-chiffre); font-size:12px; font-weight:500}
.ecart.hausse{color:var(--bon)} .ecart.baisse{color:var(--faible)}
.principal{background:var(--accent); color:var(--accent-encre); border:0; border-radius:10px; padding:10px 18px; font-weight:700; font-size:15px}
.principal[disabled]{opacity:.4; cursor:not-allowed}
.actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}

/* accueil et fin */
.accueil{max-width:720px; margin:0 auto; padding-block:48px; display:grid; gap:22px}
.accroche{font-size:18px; color:var(--encre-douce); max-width:60ch}
.questions{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px}
.question{background:var(--carte); border:1px solid var(--trait); border-radius:14px; padding:16px; display:grid; gap:4px}
.grand-chiffre{font-family:var(--f-titre); font-size:36px; font-weight:800}
.confiances{display:flex; flex-wrap:wrap; gap:6px}

.cellule{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px}
.membre{display:flex; gap:10px; align-items:flex-start; background:var(--carte); border:1px solid var(--trait); border-radius:12px; padding:10px}
.lieu{display:grid; gap:6px}
.lieu select{font:inherit; color:var(--encre); background:var(--carte); border:1.5px solid var(--trait); border-radius:10px; padding:8px 10px; max-width:420px}
.reprise{background:var(--carte); border:1.5px solid var(--accent); border-radius:14px; padding:14px; display:grid; gap:8px}
.charger summary{cursor:pointer; color:var(--accent); font-weight:700}
.charger, .code-partie{display:grid; gap:8px}
.charger textarea, .code-partie textarea{font-family:var(--f-chiffre); font-size:12px; color:var(--encre); background:var(--carte); border:1.5px solid var(--trait); border-radius:10px; padding:8px; width:100%}
.badge-idee{display:inline-block; font-size:12px; font-weight:700; color:var(--encre); background:color-mix(in srgb, var(--accent) 22%, transparent); border:1px solid var(--accent); border-radius:999px; padding:2px 8px; margin-bottom:6px}
.idees-integrees{background:var(--carte); border:1.5px solid var(--trait); border-radius:14px; padding:12px 14px}
.idees-integrees ul{margin:6px 0 0; padding-left:18px; display:grid; gap:6px}
.idees-integrees a{color:var(--accent)}
.pourquoi summary{cursor:pointer; color:var(--accent); font-size:13px; font-weight:700}
.pourquoi p{margin:4px 0 0; font-size:14px}
.cellule-suivi{display:grid; gap:6px; margin-top:14px}
.habitant-suivi{border-top:1px solid var(--trait); padding:6px 0}
.habitant-suivi summary{cursor:pointer; display:flex; align-items:center; gap:8px; list-style:none}
.habitant-suivi summary .puce{margin-left:auto}
.histoire{margin:6px 0 0; padding-left:18px; display:grid; gap:6px; font-size:14px}
.histoire p{margin:2px 0 0}
.ce-qui-compte{margin:4px 0 6px; padding-left:18px; display:grid; gap:4px; font-size:14px}
.ce-qui-compte .puce{margin-left:6px}
.nom-role{display:grid; line-height:1.25}
.role-court{font-size:12px}
.habitant-suivi summary .puce{white-space:nowrap}
.fiche-role{border-left:3px solid var(--accent); padding:2px 0 2px 10px; margin:4px 0 8px}
.fiche-role p{margin:2px 0}
/* Labo, le robot */
.labo{display:flex; gap:10px; align-items:flex-start}
.labo-tete{flex:none; width:38px; height:34px; border-radius:9px; background:var(--accent); display:flex; gap:7px; align-items:center; justify-content:center; position:relative}
.labo-tete::before{content:""; position:absolute; top:-7px; left:50%; width:2px; height:7px; background:var(--accent)}
.labo-oeil{width:7px; height:7px; border-radius:50%; background:var(--accent-encre)}
.labo-bulle{background:var(--puce); border-radius:4px 12px 12px 12px; padding:8px 12px; font-size:13.5px}

/* le jeu */
.jeu{max-width:1240px; margin:0 auto; padding-block:14px 40px; display:grid; gap:14px}
.entete{display:flex; flex-wrap:wrap; align-items:center; gap:12px 22px; padding:10px 0; border-bottom:1px solid var(--trait);
  position:sticky; top:env(safe-area-inset-top,0px); z-index:15; background:var(--fond)}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:16; background:var(--fond)}
.orbite{width:38px; height:38px; border-radius:50%; border:1.5px dashed var(--encre-douce); position:relative; flex:none}
.orbite::before{content:""; position:absolute; inset:13px; border-radius:50%; background:var(--soleil)}
.planete{position:absolute; top:15px; left:15px; width:8px; height:8px; border-radius:50%; background:var(--accent); transition:transform .6s}
.titre-revolution{display:grid; line-height:1}
.numero{font-family:var(--f-titre); font-size:28px; font-weight:800}
.titre-tranche{font-family:var(--f-titre); font-size:19px; font-weight:700; display:flex; gap:8px; align-items:center}
.scores{margin-left:auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-variant-numeric:tabular-nums}
.score{font-weight:700} .france{color:var(--encre-douce)}
.plateau{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start}
@media (max-width:860px){.plateau{grid-template-columns:minmax(0,1fr)} .jauges{position:static}}
.scene{display:grid; gap:14px; min-width:0}
.territoire{width:100%; height:230px; border-radius:14px; display:block}
.carte{background:var(--carte); border:1px solid var(--trait); border-radius:14px; padding:18px; display:grid; gap:12px}
.chiffres{display:flex; flex-wrap:wrap; gap:10px 24px}
.chiffre{display:grid; max-width:220px}
.chiffre-valeur{font-family:var(--f-titre); font-size:28px; font-weight:800; line-height:1.1}
.chiffre-legende{font-size:13.5px; color:var(--encre-douce)}
.decision-tete{display:flex; gap:12px; align-items:center}
.embleme.grand{font-size:30px}
.options{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px}
.option{text-align:left; background:var(--fond); border:1.5px solid var(--trait); border-radius:11px; padding:10px 12px; display:grid; gap:3px}
.option:hover{border-color:var(--accent)}
.option.choisie{border-color:var(--accent); background:var(--puce); box-shadow:inset 0 0 0 1px var(--accent)}
.option-libelle{font-weight:700}
.option-note{font-size:12.5px; color:var(--encre-douce)}
.apercu{display:grid; gap:14px; border-top:1px dashed var(--trait); padding-top:12px}
.score-apercu{font-variant-numeric:tabular-nums; font-weight:700}
.voix,.conseil{display:grid; gap:9px}
.bulle,.avis{display:flex; gap:10px; align-items:flex-start}
.avatar{flex:none; width:34px; height:34px; border-radius:50%; color:#fff; font-family:var(--f-titre); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center}
.avis-corps{display:grid; gap:3px; min-width:0}
.avis-nom{font-weight:700}
.argument{font-size:13.5px}
.statut{color:var(--encre-douce); font-size:12px}
.erreur{color:var(--faible); font-weight:700}

/* les jauges */
.jauges{display:grid; gap:16px; position:sticky; top:84px}
.groupe{display:grid; gap:9px}
.jauge{display:grid; gap:3px}
.jauge-tete{display:flex; gap:6px; align-items:baseline; font-size:13.5px}
.jauge-nom{flex:1}
.jauge-valeur{font-family:var(--f-chiffre); font-size:12.5px; font-variant-numeric:tabular-nums}
.barre{position:relative; height:9px; border-radius:5px; background:var(--puce); overflow:visible}
.plein{position:absolute; inset:0 auto 0 0; border-radius:5px; transition:width .5s}
.plein.bon{background:var(--bon)} .plein.moyen{background:var(--moyen)} .plein.faible{background:var(--faible)}
.fantome{position:absolute; inset:0 auto 0 0; border-radius:5px; border:2px solid var(--accent); background:transparent}
.repere{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--encre)}
.legende{font-size:12px; color:var(--encre-douce)}

.bascule{background:var(--puce); border:1px solid var(--trait); border-radius:999px; padding:4px 12px; font-size:12.5px; font-weight:700}
.bascule[aria-pressed="true"]{background:var(--accent); color:var(--accent-encre); border-color:var(--accent)}
.carte.reaction{border-color:var(--accent)}
.attitudes{display:grid; gap:8px}
.attitude{display:flex; gap:10px; align-items:center}
.attitude p{flex:1; color:var(--encre-douce); font-style:italic}
.secondaire{background:transparent; color:var(--encre); border:1.5px solid var(--trait); border-radius:10px; padding:10px 16px; font-weight:700}
.lien-discret{background:none; border:0; color:var(--accent); font-weight:700; padding:2px 0; font-size:13.5px}
.scene-outils{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.decision-prise{display:flex; justify-content:space-between; gap:8px; align-items:flex-start; font-size:13px; border-top:1px solid var(--trait); padding-top:6px}
.decision-titre{font-weight:700}
/* la scène */
.scene-dialogue{display:grid; gap:10px; background:var(--fond); border-radius:12px; padding:14px}
.replique{display:flex; gap:10px; align-items:flex-start; max-width:92%}
.replique.du-joueur{margin-left:auto; flex-direction:row-reverse; text-align:right}
.replique-corps{display:grid; gap:2px; min-width:0}
.replique-nom{font-weight:700; font-size:13px}
.replique.du-joueur .replique-corps p{background:var(--accent); color:var(--accent-encre); border-radius:12px 4px 12px 12px; padding:6px 10px}
.origine{font-size:11.5px; color:var(--encre-douce)}
.avatar.joueur{background:var(--accent); color:var(--accent-encre); font-size:11px}
.labo-tete.petite{width:34px; height:30px}
.repliques-joueur{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end}
.replique-choix{background:var(--carte); border:1.5px solid var(--accent); color:var(--encre); border-radius:999px; padding:7px 14px; font-weight:700}
.replique-choix:hover{background:var(--puce)}
.idee{display:grid; gap:8px}
.idee textarea{font:inherit; color:var(--encre); background:var(--carte); border:1.5px solid var(--trait); border-radius:10px; padding:8px 10px; width:100%}
.idee-proposee{display:grid; gap:4px; border-left:3px solid var(--accent); padding-left:10px}
.idee-proposee a{color:var(--accent); font-size:13.5px}

/* les nouvelles */
.voile{position:fixed; inset:0; background:rgb(10 12 30 / .55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20}
.nouvelles{max-width:560px; width:100%; max-height:90vh; overflow:auto}
.nouvelle{display:grid; gap:6px; padding-block:6px; border-bottom:1px solid var(--trait)}
@media (prefers-reduced-motion: reduce){.plein,.planete{transition:none}}
</style>
</head>
<body>
<div id="jeu"><p class="discret" style="padding:40px 0">Chargement du jeu…</p></div>
<script type="module" src="./js/App.js"></script>
</body>
</html>
