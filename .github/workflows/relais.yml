# Déploie le relais des idées sans compte (src/Labo.Relais) sur Cloudflare Workers. Mise en place :
# docs/relais.md. Ne tourne qu'une fois le relais configuré : variable de dépôt RELAIS_ACTIF = oui,
# et secret CLOUDFLARE_API_TOKEN.
#
# Ni Node ni Python, même ici : pas d'actions JavaScript ni de wrangler ; du shell pour l'amorçage
# seulement, puis la CLI F# (labo relais deployer, par l'API de Cloudflare).
name: Relais des idées

on:
  push:
    branches: [refonte]
    paths:
      - "src/Labo.Relais/**"
      - ".github/workflows/relais.yml"
  workflow_dispatch:

jobs:
  deployer:
    if: vars.RELAIS_ACTIF == 'oui'
    runs-on: ubuntu-latest
    steps:
      - name: Le dépôt
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: .NET 10 (le script d'installation officiel, en bash)
        run: |
          curl -sSfL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Outils (fable, paket) et paquets
        run: |
          dotnet tool restore
          dotnet paket restore

      - name: La CLI et les tests, compilés une fois
        run: dotnet build tests/Labo.Tests -c Release

      - name: Les tests (dont ceux du relais)
        run: dotnet run --no-build --project tests/Labo.Tests -c Release

      - name: Le relais compilé en JavaScript
        run: dotnet fable src/Labo.Relais -o src/Labo.Relais/js

      - name: Déployer sur Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: dotnet tools/Labo.Cli/bin/Release/net10.0/labo.dll relais deployer
