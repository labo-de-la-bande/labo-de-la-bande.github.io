# Met en ligne le nouveau jeu (branche refonte) à côté de l'ancien : https://labo-de-la-bande.github.io/jeu/
# L'ancien jeu (index.html, à la racine de main) reste le jeu en ligne tant que la bascule n'est pas
# faite : ce flux n'écrit que dans le dossier jeu/ de main.
#
# Avant de publier, il vérifie tout : les données (labo doctor), les tests (dont le moteur contre
# l'oracle), et le moteur compilé en JavaScript, dans la page assemblée, contre l'oracle.
name: Jeu en ligne

on:
  push:
    branches: [refonte]
    # un commit qui ne touche que la documentation ne change pas le jeu : pas de mise en ligne
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/relais.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeu-en-ligne
  cancel-in-progress: true

jobs:
  construire-et-publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      # les paquets NuGet et les outils, gardés d'une mise en ligne à l'autre tant que
      # paket.lock et la liste des outils ne changent pas
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('paket.lock', '.config/dotnet-tools.json') }}

      - name: Outils (fable, paket) et paquets
        run: |
          dotnet tool restore
          dotnet paket restore

      # une seule compilation : les tests dépendent de la CLI, du moteur et des données
      - name: La CLI et les tests, compilés une fois
        run: dotnet build tests/Labo.Tests -c Release

      - name: Les données sont valides et le F# généré à jour
        run: dotnet tools/Labo.Cli/bin/Release/net10.0/labo.dll doctor

      - name: Les tests, dont le moteur contre l'oracle
        run: dotnet run --no-build --project tests/Labo.Tests -c Release

      - name: L'interface compilée en JavaScript
        run: dotnet fable src/Labo.Interface -o jeu/js

      - name: La page autonome
        run: dotnet tools/Labo.Cli/bin/Release/net10.0/labo.dll assembler

      - name: La page assemblée rejoue l'oracle dans un navigateur
        env:
          LABO_CHROME: /usr/bin/google-chrome
        run: dotnet tools/Labo.Cli/bin/Release/net10.0/labo.dll verifier-js assemble

      - name: Préparer le site
        run: |
          mkdir -p site
          cp jeu/autonome.html site/index.html
          cp jeu/proposer-autonome.html site/proposer.html
          cp jeu/prenom-autonome.html site/prenom.html

      - name: Publier dans le dossier jeu/ de main
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./site
          destination_dir: jeu
          keep_files: true
          commit_message: "Nouveau jeu en ligne (jeu/), depuis refonte"
          # signé par le robot de GitHub, pas par le compte qui a poussé
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
