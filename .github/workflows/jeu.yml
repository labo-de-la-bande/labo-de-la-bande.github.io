# Met le jeu en ligne à chaque poussée sur main : https://labo-de-la-bande.github.io/jeu/
# Le site est écrit dans la branche site (labo publier), que GitHub Pages sert et que personne ne
# modifie à la main.
#
# Avant de publier, il vérifie les données (labo doctor) et les tests.
name: Jeu en ligne

on:
  push:
    branches: [main]
    # un commit qui ne touche que la documentation ne change pas le jeu : pas de mise en ligne
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/relais.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeu-en-ligne
  cancel-in-progress: true

jobs:
  construire-et-publier:
    runs-on: ubuntu-latest
    steps:
      # ni Node ni Python, même ici : pas d'actions JavaScript, du shell pour l'amorçage seulement,
      # puis tout passe par la CLI F# (labo)
      - name: Le dépôt
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: .NET 10 (le script d'installation officiel, en bash)
        run: |
          curl -sSfL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Outils (fable, paket) et paquets
        run: |
          dotnet tool restore
          dotnet paket restore

      # une seule compilation : les tests dépendent de la CLI, du moteur et des données
      - name: La CLI et les tests, compilés une fois
        run: dotnet build tests/Labo.Tests -c Release

      - name: Les données sont valides et le F# généré à jour
        run: dotnet tools/Labo.Cli/bin/Release/net10.0/labo.dll doctor

      - name: Les tests
        run: dotnet run --no-build --project tests/Labo.Tests -c Release

      - name: L'interface compilée en JavaScript
        run: dotnet fable src/Labo.Interface -o jeu/js

      - name: La page autonome
        run: dotnet tools/Labo.Cli/bin/Release/net10.0/labo.dll assembler

      - name: Publier dans la branche site
        run: dotnet tools/Labo.Cli/bin/Release/net10.0/labo.dll publier
