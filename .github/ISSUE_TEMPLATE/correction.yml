name: Signaler une erreur
description: Un chiffre, une source ou un raisonnement du jeu vous semble faux.
title: "Correction : "
labels: ["correction"]
body:
  - type: textarea
    id: passage
    attributes:
      label: Le passage concerné
      description: Rempli automatiquement si vous venez d'un lien du jeu.
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui ne va pas
    validations:
      required: true
  - type: input
    id: lien
    attributes:
      label: Une source à l'appui (si possible)
      placeholder: https://…
